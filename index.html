<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мой первый сайт</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #4e1b05;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: rgb(225, 202, 109);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
    }
    button {
      background: #0071e3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #005bb5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Сашуня! </h1>
    <p>Приглашаю тебя на встречу в пятницу в 21:30.</p>
    <button onclick="alert('Такого ответа нет!')">Отклоняю</button>
    <button class="btn-secondary" onclick="alert('Отлично, Я сам найду тебя!')">Принимаю</button>
  </div>
</body>
</html>
